spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  application:
    name: auth-service
  config:
    import: "" # disable config-server import during tests
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

auth-service:
  security:
    secret-key: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdGVzdHMtbXVzdC1iZS1sb25nLWVub3VnaA==
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
    password-strength: 4
    client-origin: http://localhost:3000

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
