# MedSync local development stack.
# Keep secrets and environment-specific values in the referenced env files.
services:

  # ============================================================
  # DATABASES
  # Each service has its own PostgreSQL container, host port,
  # persistent volume, and readiness check.
  # ============================================================

  patient-service-postgres:
    image: postgres:18
    container_name: patient-service-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${PATIENT_SERVER_DB_NAME}
      POSTGRES_USER: ${PATIENT_SERVER_DB_USERNAME}
      POSTGRES_PASSWORD: ${PATIENT_SERVER_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - patient-service-postgres-volume:/var/lib/postgresql
    networks:
      - medsync-network
    # PostgreSQL readiness check.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PATIENT_SERVER_DB_USERNAME} -d ${PATIENT_SERVER_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service-postgres:
    image: postgres:18
    container_name: auth-service-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${AUTH_SERVER_DB_NAME}
      POSTGRES_USER: ${AUTH_SERVER_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_SERVER_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - auth-service-postgres-volume:/var/lib/postgresql
    networks:
      - medsync-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_SERVER_DB_USERNAME} -d ${AUTH_SERVER_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  appointment-service-postgres:
    image: postgres:18
    container_name: appointment-service-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${APPOINTMENT_SERVER_DB_NAME}
      POSTGRES_USER: ${APPOINTMENT_SERVER_DB_USERNAME}
      POSTGRES_PASSWORD: ${APPOINTMENT_SERVER_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - appointment-service-postgres-volume:/var/lib/postgresql
    networks:
      - medsync-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${APPOINTMENT_SERVER_DB_USERNAME} -d ${APPOINTMENT_SERVER_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  doctor-service-postgres:
    image: postgres:18
    container_name: doctor-service-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${DOCTOR_SERVER_DB_NAME}
      POSTGRES_USER: ${DOCTOR_SERVER_DB_USERNAME}
      POSTGRES_PASSWORD: ${DOCTOR_SERVER_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - doctor-service-postgres-volume:/var/lib/postgresql
    networks:
      - medsync-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DOCTOR_SERVER_DB_USERNAME} -d ${DOCTOR_SERVER_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # OBSERVABILITY
  # Alloy receives OpenTelemetry data from MedSync containers and
  # forwards configured signals to Grafana Cloud.
  # OTLP receivers listen inside the Docker network on ports 4317
  # (gRPC) and 4318 (HTTP). No host ports are published here.
  # ============================================================
  grafana-alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    restart: unless-stopped
    # Start Alloy with its HTTP UI/API on port 12345 and load
    # the mounted River configuration file.
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # Provides the Grafana Cloud OTLP endpoint and authorization
    # header to Alloy. Do not commit secrets from this file.
    env_file:
      - ./.env.docker
    volumes:
      # Mount the Alloy configuration read-only.
      - ./config.alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Persist Alloy's internal storage across container recreation.
      - grafana-alloy-data:/var/lib/alloy/data
    networks:
      - medsync-network

  # ============================================================
  # CONFIG SERVICE
  # Centralized configuration server.
  # ============================================================

  config-service:
    # Build the selected Maven module using the shared multi-service image.
    # Build args are consumed during image construction, not container runtime.
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.base
      args:
        SERVICE_NAME: config-service
        SERVICE: infrastructure/config-service
        SERVICE_PORT: ${CONFIG_SERVER_PORT}
        OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION}
    container_name: config-service
    restart: unless-stopped
    environment:
      CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}
      # JVM heap settings for this service.
      JAVA_OPTS: "-Xms256m -Xmx512m"

      # OpenTelemetry: export distributed traces to Alloy.
      # Metrics and logs remain disabled by the Dockerfile defaults.
      OTEL_SERVICE_NAME: config-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy:4318
    networks:
      - medsync-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # DISCOVERY SERVICE
  # Eureka service registry and discovery server.
  # ============================================================

  discovery-service:
    # Build the selected Maven module using the shared multi-service image.
    # Build args are consumed during image construction, not container runtime.
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.base
      args:
        SERVICE_NAME: discovery-service
        SERVICE: infrastructure/discovery-service
        SERVICE_PORT: ${DISCOVERY_SERVER_PORT}
        OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION}
    container_name: discovery-service
    restart: unless-stopped
    environment:
      CONFIG_SERVER_HOSTNAME: ${CONFIG_SERVER_HOSTNAME}
      CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}
      DISCOVERY_SERVER_HOSTNAME: ${DISCOVERY_SERVER_HOSTNAME}
      DISCOVERY_SERVER_PORT: ${DISCOVERY_SERVER_PORT}
      # JVM heap settings for this service.
      JAVA_OPTS: "-Xms256m -Xmx512m"

      # OpenTelemetry: export distributed traces to Alloy.
      # Metrics and logs remain disabled by the Dockerfile defaults.
      OTEL_SERVICE_NAME: discovery-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy:4318

    depends_on:
      config-service:
        condition: service_healthy
    networks:
      - medsync-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # API GATEWAY
  # Public entry point for client requests.
  # ============================================================

  api-gateway:
    # Build the selected Maven module using the shared multi-service image.
    # Build args are consumed during image construction, not container runtime.
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.base
      args:
        SERVICE_NAME: api-gateway
        SERVICE: gateway/api-gateway
        SERVICE_PORT: ${GATEWAY_SERVER_PORT}
        OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION}
    container_name: api-gateway
    restart: unless-stopped
    environment:
      CONFIG_SERVER_HOSTNAME: ${CONFIG_SERVER_HOSTNAME}
      CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}
      DISCOVERY_SERVER_HOSTNAME: ${DISCOVERY_SERVER_HOSTNAME}
      DISCOVERY_SERVER_PORT: ${DISCOVERY_SERVER_PORT}
      GATEWAY_SERVER_PROFILES: ${GATEWAY_SERVER_PROFILES}
      GATEWAY_SERVER_PORT: ${GATEWAY_SERVER_PORT}
      # JVM heap settings for this service.
      JAVA_OPTS: "-Xms256m -Xmx512m"

      # OpenTelemetry distributed tracing.
      # The shared Dockerfile defaults metrics and logs to "none".
      OTEL_SERVICE_NAME: api-gateway
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy:4318
    # Publish the API Gateway to the host for local client access.
    ports:
      - "8222:8222"
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - medsync-network
    # Container readiness check against Spring Boot Actuator.
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8222/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # AUTH SERVICE
  # Authentication and token-related operations.
  # ============================================================

  auth-service:
    # Build the selected Maven module using the shared multi-service image.
    # Build args are consumed during image construction, not container runtime.
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.base
      args:
        SERVICE_NAME: auth-service
        SERVICE: services/auth-service
        SERVICE_PORT: ${AUTH_SERVER_PORT}
        OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION}
    container_name: auth-service
    restart: unless-stopped
    environment:
      AUTH_SERVER_DB_URL: ${AUTH_SERVER_DB_URL}
      AUTH_SERVER_DB_USERNAME: ${AUTH_SERVER_DB_USERNAME}
      AUTH_SERVER_DB_PASSWORD: ${AUTH_SERVER_DB_PASSWORD}

      AUTH_SERVER_PORT: ${AUTH_SERVER_PORT}
      AUTH_SERVER_PROFILES: ${AUTH_SERVER_PROFILES}

      AUTH_SERVER_SECRET_KEY: ${AUTH_SERVER_SECRET_KEY}
      AUTH_SERVER_ACCESS_TOKEN_EXPIRATION: ${AUTH_SERVER_ACCESS_TOKEN_EXPIRATION}
      AUTH_SERVER_REFRESH_TOKEN_EXPIRATION: ${AUTH_SERVER_REFRESH_TOKEN_EXPIRATION}
      AUTH_SERVER_PASSWORD_STRENGTH: ${AUTH_SERVER_PASSWORD_STRENGTH}
      AUTH_SERVER_CLIENT_ORIGIN: ${AUTH_SERVER_CLIENT_ORIGIN}

      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD : ${BOOTSTRAP_ADMIN_PASSWORD}

      CONFIG_SERVER_HOSTNAME: ${CONFIG_SERVER_HOSTNAME}
      CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}
      DISCOVERY_SERVER_HOSTNAME: ${DISCOVERY_SERVER_HOSTNAME}
      DISCOVERY_SERVER_PORT: ${DISCOVERY_SERVER_PORT}

      # JVM heap settings for this service.
      JAVA_OPTS: "-Xms256m -Xmx512m"

      # OpenTelemetry distributed tracing.
      # The shared Dockerfile defaults metrics and logs to "none".
      OTEL_SERVICE_NAME: auth-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy:4318

    depends_on:
      auth-service-postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

    networks:
      - medsync-network

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # PATIENT SERVICE
  # Patient-related business operations.
  # ============================================================

  patient-service:
    # Build the selected Maven module using the shared multi-service image.
    # Build args are consumed during image construction, not container runtime.
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.base
      args:
        SERVICE_NAME: patient-service
        SERVICE: services/patient-service
        SERVICE_PORT: ${PATIENT_SERVER_PORT}
        OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION}
    container_name: patient-service
    restart: unless-stopped
    environment:
      PATIENT_SERVER_DB_URL: ${PATIENT_SERVER_DB_URL}
      PATIENT_SERVER_DB_USERNAME: ${PATIENT_SERVER_DB_USERNAME}
      PATIENT_SERVER_DB_PASSWORD: ${PATIENT_SERVER_DB_PASSWORD}
      PATIENT_SERVER_PORT: ${PATIENT_SERVER_PORT}
      PATIENT_SERVER_PROFILES: ${PATIENT_SERVER_PROFILES}

      AUTH_SERVER_SECRET_KEY: ${AUTH_SERVER_SECRET_KEY}
      ENCRYPTION_KEY: ${PATIENT_ENCRYPTION_KEY}
      MEDSYNC_HASH_KEY: ${PATIENT_HASH_KEY}

      CONFIG_SERVER_HOSTNAME: ${CONFIG_SERVER_HOSTNAME}
      CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}

      DISCOVERY_SERVER_HOSTNAME: ${DISCOVERY_SERVER_HOSTNAME}
      DISCOVERY_SERVER_PORT: ${DISCOVERY_SERVER_PORT}

      # JVM heap settings for this service.
      JAVA_OPTS: "-Xms256m -Xmx512m"

      # OpenTelemetry distributed tracing.
      # The shared Dockerfile defaults metrics and logs to "none".
      OTEL_SERVICE_NAME: patient-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy:4318

    depends_on:
      patient-service-postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - medsync-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # DOCTOR SERVICE
  # Doctor-related business operations.
  # ============================================================

  doctor-service:
    # Build the selected Maven module using the shared multi-service image.
    # Build args are consumed during image construction, not container runtime.
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.base
      args:
        SERVICE_NAME: doctor-service
        SERVICE: services/doctor-service
        SERVICE_PORT: ${DOCTOR_SERVER_PORT}
        OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION}
    container_name: doctor-service
    restart: unless-stopped
    environment:
      DOCTOR_SERVER_DB_URL: ${DOCTOR_SERVER_DB_URL}
      DOCTOR_SERVER_DB_USERNAME: ${DOCTOR_SERVER_DB_USERNAME}
      DOCTOR_SERVER_DB_PASSWORD: ${DOCTOR_SERVER_DB_PASSWORD}
      DOCTOR_SERVER_PORT: ${DOCTOR_SERVER_PORT}
      DOCTOR_SERVER_PROFILES: ${DOCTOR_SERVER_PROFILES}

      AUTH_SERVER_SECRET_KEY: ${AUTH_SERVER_SECRET_KEY}
      ENCRYPTION_KEY: ${DOCTOR_ENCRYPTION_KEY}
      MEDSYNC_HASH_KEY: ${DOCTOR_HASH_KEY}

      CONFIG_SERVER_HOSTNAME: ${CONFIG_SERVER_HOSTNAME}
      CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}
      DISCOVERY_SERVER_HOSTNAME: ${DISCOVERY_SERVER_HOSTNAME}
      DISCOVERY_SERVER_PORT: ${DISCOVERY_SERVER_PORT}
      # JVM heap settings for this service.
      JAVA_OPTS: "-Xms256m -Xmx512m"

      # OpenTelemetry distributed tracing.
      # The shared Dockerfile defaults metrics and logs to "none".
      OTEL_SERVICE_NAME: doctor-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy:4318
    depends_on:
      doctor-service-postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - medsync-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================================
  # APPOINTMENT SERVICE
  # Appointment-related business operations.
  # ============================================================

  appointment-service:
    # Build the selected Maven module using the shared multi-service image.
    # Build args are consumed during image construction, not container runtime.
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.base
      args:
        SERVICE_NAME: appointment-service
        SERVICE: services/appointment-service
        SERVICE_PORT: ${APPOINTMENT_SERVER_PORT}
        OTEL_AGENT_VERSION: ${OTEL_AGENT_VERSION}
    container_name: appointment-service
    restart: unless-stopped
    environment:
      APPOINTMENT_SERVER_DB_URL: ${APPOINTMENT_SERVER_DB_URL}
      APPOINTMENT_SERVER_DB_USERNAME: ${APPOINTMENT_SERVER_DB_USERNAME}
      APPOINTMENT_SERVER_DB_PASSWORD: ${APPOINTMENT_SERVER_DB_PASSWORD}
      APPOINTMENT_SERVER_PORT: ${APPOINTMENT_SERVER_PORT}
      APPOINTMENT_SERVER_PROFILES: ${APPOINTMENT_SERVER_PROFILES}

      AUTH_SERVER_SECRET_KEY: ${AUTH_SERVER_SECRET_KEY}

      CONFIG_SERVER_HOSTNAME: ${CONFIG_SERVER_HOSTNAME}
      CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT}
      DISCOVERY_SERVER_HOSTNAME: ${DISCOVERY_SERVER_HOSTNAME}
      DISCOVERY_SERVER_PORT: ${DISCOVERY_SERVER_PORT}

      # JVM heap settings for this service.
      JAVA_OPTS: "-Xms256m -Xmx512m"

      # OpenTelemetry distributed tracing.
      # The shared Dockerfile defaults metrics and logs to "none".
      OTEL_SERVICE_NAME: appointment-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy:4318

    depends_on:
      appointment-service-postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
    networks:
      - medsync-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8004/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================================
# NAMED VOLUMES
# Persist database data and Alloy internal storage.
# ============================================================

volumes:
  patient-service-postgres-volume:
  auth-service-postgres-volume:
  appointment-service-postgres-volume:
  doctor-service-postgres-volume:
  grafana-alloy-data:

# ============================================================
# NETWORKS
# Services communicate through this private Docker bridge network.
# ============================================================

networks:
  medsync-network:
    driver: bridge
