spring:
  application:
    name: config-service
  profiles:
    active: native
  security:
    user:
      name: ${SERVER_USER}
      password: ${SERVER_PASSWORD}
  config:
    import: classpath:./config/common/application.yaml
  cloud:
    config:
      server:
        native:
          search-locations:
            - classpath:./config/common
            - classpath:./config/{application}

server:
  port: ${CONFIG_SERVER_PORT}