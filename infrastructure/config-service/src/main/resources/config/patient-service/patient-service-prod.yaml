spring:
  datasource:
    url: ${PATIENT_SERVER_DB_URL}
    username: ${PATIENT_SERVER_DB_USERNAME}
    password: ${PATIENT_SERVER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false