spring:
  datasource:
    url: ${DOCTOR_SERVER_DB_URL}
    username: ${DOCTOR_SERVER_DB_USERNAME}
    password: ${DOCTOR_SERVER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true