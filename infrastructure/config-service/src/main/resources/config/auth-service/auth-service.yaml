spring:
  devtools:
    add-properties: false

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    org.hibernate: warn
    org.springframework.jdbc: warn
    com.medsync.authservice: info

server:
  port: ${AUTH_SERVER_PORT:8001}