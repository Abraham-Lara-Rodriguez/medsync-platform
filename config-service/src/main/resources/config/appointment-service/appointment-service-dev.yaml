spring:
  datasource:
    url: ${APPOINTMENT_DB_URL}
    username: ${APPOINTMENT_DB_USERNAME}
    password: ${APPOINTMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true